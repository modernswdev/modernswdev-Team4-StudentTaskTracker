
services:
  mysql:
    image: mysql:8.4
    container_name: student-task-tracker-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: student_task_tracker
      MYSQL_USER: tracker
      MYSQL_PASSWORD: tracker_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/tasks.sql:/docker-entrypoint-initdb.d/1-tasks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-task-tracker-app
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: tracker
      MYSQL_PASSWORD: tracker_password
      MYSQL_DATABASE: student_task_tracker
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
